# Serviços de apoio para desenvolvimento local.
#   docker compose up -d   -> sobe MongoDB e PostgreSQL e aplica as migrações
# A API e os workers rodam na máquina (go run), não neste compose.

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TimescaleDB + PostGIS (a imagem "ha" já inclui as duas extensões).
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: tcc
      POSTGRES_PASSWORD: tcc
      POSTGRES_DB: tcc
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcc -d tcc"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Tarefa única: aplica as migrações quando o PostgreSQL estiver saudável.
  # É idempotente, então pode rodar a cada "up".
  migrar:
    image: timescale/timescaledb-ha:pg16
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - psql
      - postgres://tcc:tcc@postgres:5432/tcc
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /migrations/0001_init.up.sql
    restart: "no"

volumes:
  mongo-data:
  pg-data:
