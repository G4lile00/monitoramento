# Ambiente local completo.
#
#   podman compose up -d --build   (ou: docker compose ...)
#       sobe MongoDB, PostgreSQL, migrações, processador e API
#       API e Swagger: http://localhost:8080/swagger
#
#   podman compose --profile mqtt up -d --build
#       inclui o ingestor MQTT TTN (exige MQTT_* no .env)
#
#   podman compose --profile sensor_deslizamento up -d --build
#       inclui o ingestor MQTT ChirpStack v4 (exige SD_MQTT_* no .env)
#
#   podman compose --profile mqtt --profile sensor_deslizamento up -d --build
#       sobe os dois ingestores ao mesmo tempo (TTN + ChirpStack)
#
# Para testar sem broker, use "make carregar" (arquivo JSON -> MongoDB).

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TimescaleDB + PostGIS (a imagem "ha" já inclui as duas extensões).
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: tcc
      POSTGRES_PASSWORD: tcc
      POSTGRES_DB: tcc
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcc -d tcc"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Tarefa única: aplica as migrações quando o PostgreSQL estiver saudável.
  # É idempotente, então pode rodar a cada "up". Inclui 0001 (modelo base)
  # e 0002 (grandezas do sensor de deslizamento).
  migrar:
    image: timescale/timescaledb-ha:pg16
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - |
        psql postgres://tcc:tcc@postgres:5432/tcc -v ON_ERROR_STOP=1 \
          -f /migrations/0001_init.up.sql \
          -f /migrations/0002_grandezas_sd.up.sql
    restart: "no"

  # MQTT -> MongoDB. Só sobe com --profile mqtt.
  ingestor:
    profiles: ["mqtt"]
    build:
      context: .
      dockerfile: cmd/ingestor/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MQTT_BROKER: ${MQTT_BROKER:-}
      MQTT_USUARIO: ${MQTT_USUARIO:-}
      MQTT_SENHA: ${MQTT_SENHA:-}
      MQTT_TOPICO: ${MQTT_TOPICO:-v3/+/devices/+/up}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-tcc-ingestor}
      MQTT_QOS: ${MQTT_QOS:-1}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-tcc_bruto}
    restart: unless-stopped

  # MQTT (ChirpStack v4) -> MongoDB. Só sobe com --profile sensor_deslizamento.
  # Variáveis com prefixo SD_* para poder rodar em paralelo com o ingestor TTN.
  sensor_deslizamento:
    profiles: ["sensor_deslizamento"]
    build:
      context: .
      dockerfile: cmd/sensor_deslizamento/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SD_MQTT_BROKER: ${SD_MQTT_BROKER:-}
      SD_MQTT_USUARIO: ${SD_MQTT_USUARIO:-}
      SD_MQTT_SENHA: ${SD_MQTT_SENHA:-}
      SD_MQTT_TOPICO: ${SD_MQTT_TOPICO:-application/+/device/+/event/up}
      SD_MQTT_CLIENT_ID: ${SD_MQTT_CLIENT_ID:-tcc-sensor-deslizamento}
      SD_MQTT_QOS: ${SD_MQTT_QOS:-1}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-tcc_bruto}
    restart: unless-stopped

  # One-shot: ingere testdata/mensagens_sd_exemplo.json (ChirpStack v4) no
  # MongoDB. Para testar o fluxo completo sem broker. Roda uma vez e encerra;
  # o processador (que está rodando) consome os documentos e grava no
  # PostgreSQL automaticamente.
  #
  #   docker compose --profile carregar-sd up --build carregar-sd
  #   (sem -d: vê a saída no terminal; container encerra ao terminar)
  carregar-sd:
    profiles: ["carregar-sd"]
    build:
      context: .
      dockerfile: cmd/carregar/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-tcc_bruto}
    volumes:
      - ./testdata:/testdata:ro
    command:
      - "-arquivo"
      - "/testdata/mensagens_sd_exemplo.json"
      - "-topico"
      - "chirpstack/simulado"
    restart: "no"

  # MongoDB -> PostgreSQL.
  processador:
    build:
      context: .
      dockerfile: cmd/processador/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-tcc_bruto}
      DATABASE_URL: postgres://tcc:tcc@postgres:5432/tcc?sslmode=disable
      WORKERS: ${WORKERS:-2}
      MAX_TENTATIVAS: ${MAX_TENTATIVAS:-5}
      RESERVA_SEGUNDOS: ${RESERVA_SEGUNDOS:-60}
      INTERVALO_MS: ${INTERVALO_MS:-500}
      AUTO_CADASTRAR_SENSOR: ${AUTO_CADASTRAR_SENSOR:-true}
    restart: unless-stopped

  # API REST + Swagger.
  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    depends_on:
      migrar:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://tcc:tcc@postgres:5432/tcc?sslmode=disable
      API_ADDR: ":8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mongo-data:
  pg-data:
